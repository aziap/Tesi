---
auths:
  public_v1:
    version: 1
  public_v2:
    version: 2

modules:
  # SNMPv2-MIB for things like sysDescr, sysUpTime, etc.
  system:
    walk:
      - "SNMPv2-MIB::system"
      - "SNMPv2-MIB::sysName"
      - "SNMPv2-MIB::sysUpTime"
    lookups:
      - source_indexes: [sysORIndex]
        lookup: "SNMPv2-MIB::sysORDescr"
  # Default IF-MIB interfaces table with ifIndex.
  if_mib:
    walk:
      - "IF-MIB::interfaces"
      - "IF-MIB::ifXTable"
    lookups:
      - source_indexes: [ifIndex]
        lookup: "IF-MIB::ifAlias"
      - source_indexes: [ifIndex]
        # Disambiguate from PaloAlto PAN-COMMON-MIB::ifDescr.
        lookup: "IF-MIB::ifDescr"
      - source_indexes: [ifIndex]
        # Disambiguate from Netscaler NS-ROOT-MIB::ifName.
        lookup: "IF-MIB::ifName"
    overrides:
      ifAlias:
        ignore: true # Lookup metric
      ifDescr:
        ignore: true # Lookup metric
      ifName:
        ignore: true # Lookup metric
      ifType:
        type: EnumAsInfo

# OSPF MIB from Observium
  ospf:
    walk:
      # ospfGeneralGroup
      - ospfRouterId
      - ospfRxNewLsas
      - ospfAdminStat
      - ospfAsLsaCount
      - ospfAreaBdrRtrStatus
      - ospfASBdrRtrStatus
      - ospfExternLsaCount
      - ospfOriginateNewLsas
      # Table: ospfNbrTable (Table describing all neighbors on the locality of the OSPF router)
      # Row: ospfNbrEntry
      # Columns:
      - ospfNbrIpAddr
      - ospfNbrRtrId
      - ospfNbrPriority
      - ospfNbrState
      - ospfNbrEvents
      
      # Chat dice di non metterle ma voglio controllare:
      - ospfRouteGroup
      - ospfIntraArea
      - ospfInterArea
      
      # Table: ospfLocalLsdbTable (Represents the process' Link State Data Base)
      # Row: ospfLocalLsdbEntry
      # Columns:
      - ospfLocalLsdbIpAddress
      - ospfLocalLsdbType
      - ospfLocalLsdbLsid
      - ospfLocalLsdbRouterId
      - ospfLocalLsdbSequence
      - ospfLocalLsdbAdvertisement
      
      # Table: ospfAsLsdbTable (AS-scope LSA link state database)
      # Row: ospfAsLsdbEntry
      # Columns:
      - ospfAsLsdbLsid
      - ospfAsLsdbRouterId
      
      # Table: ospfAreaTable (configured parameters and cumulative statistics of the router's attached areas)
      # Row: ospfAreaEntry
      # Columns:
      - ospfAreaId
      - ospfSpfRuns
      - ospfAreaBdrRtrCount
      - ospfAsBdrRtrCount
      - ospfAreaLsaCount
      
      - ospfAreaLsaCountTable # Table      
      - ospfLsdbTable # Table
      - ospfAreaRangeTable  # Table
      
      # Table: ospfIfTable (Describes the interfaces from the viewpoint of OSPF)
      # Row: ospfIfEntry
      # Columns:
      - ospfIfIpAddress
      - ospfIfState
      - ospfIfDesignatedRouter
      - ospfIfBackupDesignatedRouter
      - ospfIfEvents
      - ospfIfLsaCount
      - ospfIfDesignatedRouterId
      - ospfIfBackupDesignatedRouterId
      - ospfIfAreaId
      - ospfIfType  # 1 = broadcast; 2 = nbma; 3 = pointToPoint; 5 = PointToMultipoint
      - ospfIfAdminStat # 1 = enabled; 2 = disabled
      
    # TODO: controllare se effettivamente serve a qualcosa
    # overrides:
      # ospfLsdbAdvertisement:
        # display_hint: "255a"
        
  ip_mib:
    walk:
      - ipAddressIfIndex          # da ipAddressTable: indirizzo -> ifIndex
      - ipAddressPrefixOnLinkFlag # da ipAddressPrefixTable: forza il walk della tabella
                                   # (qualsiasi colonna va bene, serve solo a "toccare" la tabella
                                   #  così i suoi indici diventano label automaticamente)
    lookups:
      - source_indexes: [ipAddressPrefixIfIndex]
        lookup: "IF-MIB::ifDescr"
      
  ip_forward:
    walk:
      - inetCidrRouteTable
    
